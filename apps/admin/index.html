<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f1419" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("sightloop.admin.theme");
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute("content", theme);
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) {
            bar.setAttribute("content", theme === "dark" ? "#0f1419" : "#eef2f6");
          }
          var locale = localStorage.getItem("sightloop.admin.locale");
          if (locale === "zh-CN" || locale === "en") {
            document.documentElement.lang = locale === "zh-CN" ? "zh-CN" : "en";
          }
        } catch (e) {}
      })();
    </script>
    <title>SightLoop Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
