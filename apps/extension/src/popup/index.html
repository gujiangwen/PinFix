<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SightLoop</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <header class="brand-row">
        <h1>SightLoop</h1>
        <span id="runnerBadge" class="runner-badge" title="">Runner: …</span>
      </header>
      <p class="lede" id="summaryLine">本地 DX — 探测 Daemon、准备 Demo 或绑定仓库</p>

      <section class="lights" aria-label="DX status">
        <div class="light" data-k="daemon"><span class="dot"></span>Daemon</div>
        <div class="light" data-k="token"><span class="dot"></span>Token</div>
        <div class="light" data-k="project"><span class="dot"></span>Project</div>
        <div class="light" data-k="github"><span class="dot"></span>GitHub</div>
      </section>
      <p class="hint heal" id="githubHeal" hidden></p>

      <div class="cta-row">
        <button id="prepareDemo" type="button" class="primary">一键准备 Demo</button>
        <button id="discover" type="button">重新探测</button>
      </div>

      <details class="advanced">
        <summary>高级 / 绑定仓库</summary>
        <label>
          Daemon URL
          <input id="daemonUrl" type="url" spellcheck="false" />
        </label>
        <label>
          Token
          <input id="token" type="password" autocomplete="off" spellcheck="false" />
        </label>
        <label>
          Project
          <select id="projectId">
            <option value="">— load projects —</option>
          </select>
        </label>
        <div class="row">
          <button id="refresh" type="button">刷新项目</button>
          <button id="save" type="button">保存</button>
          <button id="bootstrap" type="button">Bootstrap token</button>
        </div>
        <label>
          本机仓库绝对路径
          <input id="repoPath" type="text" spellcheck="false" placeholder="/tmp/my-app" />
        </label>
        <div class="row">
          <button id="bindRepo" type="button" class="primary">绑定本机仓库</button>
          <button id="pick" type="button">切换拾取</button>
        </div>
      </details>

      <p id="status" class="status"></p>
      <p class="hint">
        Daemon 未启动时请运行 <code>pnpm dev:daemon</code> · Fixture：
        <code>pnpm dev:fixture</code> · 热键 <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>A</kbd>
      </p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
