<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PinFix 页面标注</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --ink: #1c2430;
      --muted: #5c6b7a;
      --line: #e2e7ee;
      --accent: #1f6f5b;
      --accent-ink: #ffffff;
      --select: #e5f4ef;
      @media (prefers-color-scheme: dark) {
        --bg: #171d27;
        --ink: #e7eef8;
        --muted: #9aabbf;
        --line: #2c3a4c;
        --accent: #3dbea2;
        --accent-ink: #06241c;
        --select: #16352d;
      }
      @supports (color: light-dark(white, black)) {
        --bg: light-dark(#ffffff, #171d27);
        --ink: light-dark(#1c2430, #e7eef8);
        --muted: light-dark(#5c6b7a, #9aabbf);
        --line: light-dark(#e2e7ee, #2c3a4c);
        --accent: light-dark(#1f6f5b, #3dbea2);
        --accent-ink: light-dark(#ffffff, #06241c);
        --select: light-dark(#e5f4ef, #16352d);
      }
    }
    * { box-sizing: border-box; }
    .vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    body { margin: 0; width: 216px; padding: 10px; font: 13px/1.4 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    #annotate-group {
      display: flex; width: 100%; gap: 6px;
    }
    #annotate-group > button {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid var(--accent); border-radius: 10px; padding: 7px 10px;
      background: transparent; color: var(--ink);
      font: inherit; font-weight: 500; cursor: pointer; transition: filter 0.12s, background-color 0.12s;
    }
    #annotate-group > #annotate { background: var(--accent); color: var(--accent-ink); }
    #annotate-group > #annotate-shot:hover { background: var(--select); filter: none; }
    #annotate-group > #annotate:hover { filter: brightness(1.08); }
    #annotate-group > button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #annotate-group > button[data-picking="true"] { background: var(--select); color: var(--ink); }
    #annotate-group > button[aria-disabled="true"] {
      background: transparent; border-color: var(--line); color: var(--muted); cursor: default; filter: none;
    }
    #status {
      display: flex; align-items: center; gap: 6px; min-height: 1.2em;
      margin: 6px 2px 0; color: var(--muted); font-size: 12px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #status > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #status::before {
      content: ""; width: 6px; height: 6px; border-radius: 99px; flex: none;
      background: var(--muted); opacity: 0.45;
    }
    #status[data-mode="live"]::before { background: var(--accent); opacity: 1; }
    #status[data-mode="copy"]::before { background: var(--accent); opacity: 0.65; }
    #settings {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; margin-left: auto; flex: none;
      border: 1px solid var(--line); border-radius: 8px; background: transparent;
      color: var(--muted); cursor: pointer;
    }
    #settings:hover { border-color: var(--accent); color: var(--accent); }
    #settings:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #settings svg { width: 14px; height: 14px; }
    #update {
      display: none; align-items: center; gap: 6px; width: 100%;
      margin: 0 0 8px; padding: 7px 10px; border: 1px solid #c47a3a; border-radius: 8px;
      background: rgba(196, 122, 58, 0.1); color: #a05a1c; font-size: 12px; text-align: left;
      cursor: pointer;
    }
    #update:hover { background: rgba(196, 122, 58, 0.18); }
    #update svg { width: 14px; height: 14px; flex: none; }
    #update[data-show="true"] { display: flex; }
    #update .v { font-weight: 600; }
    #shortcut-hint {
      display: flex; align-items: center; justify-content: center; gap: 4px;
      margin: 6px 0 0; font-size: 11px; color: var(--muted);
    }
    #shortcut-hint kbd {
      padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px;
      background: var(--bg); font: 10px/1.4 ui-monospace, monospace;
    }
    #shortcut-hint button {
      border: 0; background: none; padding: 0; color: var(--accent); font: inherit;
      cursor: pointer; text-decoration: underline;
    }
  </style>
</head>
<body>
  <div focusgroup="menu nomemory" aria-label="PinFix 页面标注">
    <button type="button" id="update" data-show="false">
      <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path d="M10 2a8 8 0 1 0 8 8h-1.5A6.5 6.5 0 1 1 10 3.5c1.8 0 3.4.7 4.6 1.9L13 7h5V2l-1.8 1.8A8 8 0 0 0 10 2zm-.8 4h1.6v4.3l2.1-2.1 1.1 1.1-4 4-4-4 1.1-1.1 2.1 2.1V6z"/>
      </svg>
      <span>发现新版本 <span class="v" id="update-version"></span>，点击下载</span>
    </button>
    <div id="annotate-group" role="group" aria-label="标注方式">
      <button type="button" id="annotate" aria-disabled="true" aria-describedby="status">
        <span id="annotate-label">简单标注</span>
      </button>
      <button type="button" id="annotate-shot" aria-disabled="true" aria-describedby="status">
        <span id="annotate-shot-label">截图标注</span>
      </button>
    </div>
  </div>
  <p id="status" role="status">
    <span id="status-text">正在检查状态</span>
    <button type="button" id="settings" title="设置" aria-label="设置">
      <svg viewBox="0 0 20 20" aria-hidden="true" fill="currentColor">
        <path d="M10 6.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm0 1.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM10.9 2l.4 1.6a5.7 5.7 0 0 1 1.6.7l1.4-.8 1.2 2-1 1.1c.3.6.5 1.3.5 2s-.2 1.4-.5 2l1 1.1-1.2 2-1.4-.8a5.7 5.7 0 0 1-1.6.7L10.9 18H8.9l-.4-1.6a5.7 5.7 0 0 1-1.6-.7l-1.4.8-1.2-2 1-1.1a5.6 5.6 0 0 1 0-4l-1-1.1 1.2-2 1.4.8a5.7 5.7 0 0 1 1.6-.7L8.9 2h2z"/>
      </svg>
    </button>
  </p>
  <p id="shortcut-hint">
    <kbd id="shortcut-display">Alt+Shift+P</kbd>
    <span>无效？<button type="button" id="shortcut-fix">修改快捷键</button></span>
  </p>
  <script src="popup.js"></script>
</body>
</html>
