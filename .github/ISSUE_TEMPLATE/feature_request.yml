name: 功能请求
description: 提出新能力或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        建议尽量说明使用场景和当前替代方案，这比描述界面或实现更有帮助。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁、在什么工作流中、遇到什么问题
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 当前做法
      description: 现在如何绕过这个问题
  - type: textarea
    id: proposal
    attributes:
      label: 期望的能力
  - type: checkboxes
    id: checks
    attributes:
      label: 附加确认
      options:
        - label: 该能力不需要新的运行时依赖
        - label: 该能力适用于提示词模式与 SightLoop 模式
        - label: 我愿意提交实现（PR）
